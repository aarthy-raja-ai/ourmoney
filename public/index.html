<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OurMoney - Privacy & Legal Portal</title>
  <meta http-equiv="refresh" content="0; url=privacy-policy.html">
  <style>
    :root {
      --bg: #060E1E;
      --card-bg: #0F1D35;
      --border: #253352;
      --primary: #5B7BF3;
      --text: #F8F9FC;
      --subtext: #A8B3C8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 480px;
      width: 90%;
    }
    .logo {
      width: 48px;
      height: 48px;
      background: var(--primary);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: #fff;
      margin: 0 auto 16px auto;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
    }
    p {
      color: var(--subtext);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: var(--primary);
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      margin: 6px;
    }
    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">OM</div>
    <h1>OurMoney Legal & Compliance</h1>
    <p>Redirecting to Privacy Policy...</p>
    <div>
      <a href="privacy-policy.html" class="btn">Privacy Policy</a>
      <a href="support.html" class="btn btn-outline">Support</a>
      <a href="delete-account.html" class="btn btn-outline">Account Deletion</a>
    </div>
  </div>
</body>
</html>
